# Work by voice: what the car may ask your machine to work on.
# Copy to ~/.config/omacar/work.toml on the machine that runs `omacar work serve`.
host = "tablet"          # "tablet" or "box"
# Work while driving is the owner's choice. true runs sessions, speech, PRs and diffs while the
# car moves. Risks: the tablet's CPU is shared with drowsy detection (Work warns once per drive
# when it is busy); CVC §27602 restricts screens in the driver's view and NHTSA's guideline is
# glances under 2 seconds. Leave it false (the default) to keep Work parked-only.
while_moving = true
daily_cap = 6
quiet = [21, 7]          # hours when lines are shown, not spoken, while parked
# relay_url = "http://omarchy:7570"   # where the tablet's app finds the relay (host = "box")

[project.omacar]
names = ["omacar", "car", "the car app"]
path  = "~/Projects/omacar-work-src"   # never the live checkout ~/Projects/omacar
gate  = "test/all.sh"
