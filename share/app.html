<!doctype html>
<!-- OmaCar — the workshop.
     One page, no build step, served over http://127.0.0.1 by lib/serve.py.

     Everything here is an ES module loaded straight from disk. There is no
     bundler, no framework and no lockfile, because the thing this replaces is
     a five-thousand-dollar tablet that stops getting updates when its vendor
     decides it should, and a tool you cannot open and repair is the same trap
     in a different colour.

     Layout is a fixed vehicle bar at the top, one scrolling view, and a
     navigation block pinned to the bottom. The vehicle identity NEVER leaves
     the screen: every scan tool that has ever shown somebody the wrong car's
     data got there by letting it. -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OmaCar</title>
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="css/app.css">

<!-- The palette on paper.
     app.css already declares a print palette on :root, and it never arrives:
     main.js applies the Omarchy theme as INLINE custom properties on the root
     element, and an inline declaration outranks any stylesheet rule, print
     media query or not. So a printed report came out in the dark theme's
     near-white ink on white paper — a page of headings you cannot read, which
     is the one artefact here that leaves the machine.

     The surfaces are app.css's own print values, re-asserted at the only
     weight that beats an inline declaration. The five semantic colours are new
     here, because app.css does not print them at all: a theme's amber is
     chosen to carry on a near-black panel and on white paper it is a smudge,
     so paper gets darker versions of the same five meanings. Nothing here
     changes the screen. -->
<style>
  @media print {
    :root {
      --ground: #fff !important; --panel: #fff !important; --panel-2: #fff !important;
      --ink: #111 !important; --dim: #444 !important; --faint: #666 !important;
      --edge: #ccc !important;
      --ok: #1B7A4B !important; --warn: #8A5A05 !important; --bad: #A32A1B !important;
      --info: #17558F !important; --ai: #4B3FA8 !important;
    }
  }
</style>

<!-- d3 is an ES module like everything else here, so the import in
     js/charts-d3.js is the whole of its wiring. This line only asks the
     browser to start fetching it alongside the HTML rather than two module
     hops later; drop it and the app still works. -->
<link rel="modulepreload" href="js/vendor/d3.min.js">

<div id="app" class="app" data-booting="1">
  <header class="vbar" id="vbar"></header>

  <main class="stage" id="stage" tabindex="-1"></main>

  <!-- THE NAVIGATION COMES AFTER THE STAGE, AND THAT IS DELIBERATE.
       It is placed by grid area, not by position:fixed on a DOM-first
       element. Put visually-bottom navigation first in the document and every
       keyboard user pays five tab stops before reaching a word of the screen
       they just opened — the accessibility failure that "just make it fixed"
       always ships with. Reading order, focus order and visual order are the
       same order here.

       The document itself does not scroll; .stage does. So this block is
       already outside the scroller and needs no hide-on-scroll behaviour —
       and it never hides. In a moving car, navigation that comes and goes is
       navigation you look down to hunt for.

       Both rows are filled by main.js, which builds them once and afterwards
       only updates their text and their state. -->
  <nav class="navbar" id="navbar" aria-label="Sections">
    <div class="subbar">
      <div class="subbar-lead" id="subbar-lead"></div>
      <div class="subbar-chips" id="subbar-chips"></div>
    </div>
    <div class="tabbar" id="tabbar"></div>
  </nav>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div class="modal-host" id="modal-host" hidden></div>
</div>

<noscript>
  <p style="padding:2rem;font-family:monospace">OmaCar needs JavaScript. Everything
  it shows is also available from the terminal — try <code>omacar doctor</code>.</p>
</noscript>

<script type="module" src="js/main.js"></script>
