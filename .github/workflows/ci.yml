# OmaCar CI.
#
# GITHUB-HOSTED RUNNERS (the owner's decision, 2026-10-26). This repository is
# public, and GitHub-hosted standard runners are free for public repositories
# and run in a throwaway VM, so every job here runs on `ubuntu-latest`. This
# supersedes the 2026-09-29 rule that sent every job to the self-hosted
# runners.
#
# NO SELF-HOSTED JOB LIVES IN THIS FILE, because nothing here needs hardware:
# no GPU, no Metal, no Asahi, no car. If a hardware lane is ever added, it must
# keep a labelled `runs-on` (never a bare `self-hosted`), must never run for a
# pull request from a fork (gate it on
# `github.event.pull_request.head.repo.full_name == github.repository`, or on
# push / workflow_dispatch / a maintainer-applied label), and nothing here may
# use pull_request_target.
#
# The token is read-only (`permissions: contents: read`).
#
# EACH JOB HAS ITS OWN VM, so the old shared-$HOME hazard is gone; the
# "A HOME of this job's own" steps are kept because they are harmless and keep
# OmaCar's venv and state out of the runner user's real home.
#
# Nothing here needs a car or an adapter: the ELM327 emulator stands in for a
# vehicle and the guard suite stubs pyserial.

name: CI

on:
  push:
    branches: [main, omacar-launch]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Four runners serve every omauilabs repository; a newer push to the same
# branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests — needs no car
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A REAL CHROME, NEVER A SNAP WRAPPER. On GitHub's ubuntu-latest,
    # /usr/bin/chromium is the snap shim, and headless Chromium under it hung
    # every app test for 120 s (seen 2026-09-08, 76b3e93). The hosted image
    # also ships Google Chrome as a plain package, so we name that one. The
    # browser tests take OMACAR_CHROME first, and fail rather than skip if it
    # names nothing runnable, so this can never go green by quietly not
    # running. The "What we are running on" step prints its version.
    env:
      OMACAR_CHROME: google-chrome
    steps:
      - name: A HOME of this job's own
        run: |
          mkdir -p "$RUNNER_TEMP/home"
          echo "HOME=$RUNNER_TEMP/home" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - name: What we are running on
        run: |
          echo "python3: $(python3 --version 2>&1)"
          echo "bash:    ${BASH_VERSION}"
          echo "sqlite3: $(sqlite3 --version 2>/dev/null || echo 'absent')"
          echo "chrome:  $("$OMACAR_CHROME" --version 2>/dev/null || echo "absent: $OMACAR_CHROME")"

      # WITHOUT A VENV, THE PROSPECTOR TESTS SKIP -- and a suite that skips
      # quietly is the exact thing this project exists to not be. Building it
      # costs about a minute and turns a skip into a check.
      # It is allowed to fail: the ELM327 emulator's own build is fragile
      # (its setup.py wants pkg_resources, removed in setuptools 81), and the
      # rest of the suite is worth running either way. The step says which
      # happened rather than leaving it to be inferred.
      - name: Build the Python environment
        id: venv
        continue-on-error: true
        run: ./bin/omacar setup

      - name: Say whether the prospector tests will run
        run: |
          if [ -x "$HOME/.local/share/omacar/venv/bin/python" ]; then
            echo "venv present — every suite runs"
          else
            echo "::warning::no venv, so the prospector tests will skip"
          fi

      # THE FACE TRACKER'S FILES ARE NOT IN GIT. Drowsy mode's MediaPipe bundle,
      # its wasm and the face model are fetched once and pinned by sha256
      # (share/assets/manifest.json), so the vendor suites fail here unless they are
      # fetched first. The pin is checked on every download: a changed file
      # fails this step rather than reaching the tests.
      - name: The face tracker's files (fetched, pinned, never committed)
        run: ./bin/omacar assets fetch

      # The suite installs into a scratch HOME and asserts the real state
      # directory was never touched, so it is safe to run on a machine that has
      # OmaCar on it. It says so out loud at the end.
      - name: test/all.sh
        run: ./test/all.sh

      # Separately, and loudly, because it is the one that protects the car: the
      # guards are the checks that were written, looked right, and did not hold.
      - name: The guards, on their own
        run: python3 test/guards_test.py

  syntax:
    name: Everything parses
    # A light job (12 s median; python ast, bash -n, grep).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Python
        run: |
          fail=0
          for f in lib/*.py test/*.py; do
            python3 -c "import ast,sys; ast.parse(open('$f').read())" || { echo "  $f"; fail=1; }
          done
          exit $fail

      - name: Shell
        run: |
          fail=0
          for f in bin/omacar install.sh uninstall.sh test/*.sh; do
            bash -n "$f" || { echo "  $f"; fail=1; }
          done
          exit $fail

      # Four stylesheets were once written, correct, and never linked. Nothing
      # errored, nothing looked wrong in review, and the app rendered unstyled.
      # This is the cheap check that would have caught it.
      - name: Every asset the app references exists
        run: |
          fail=0
          for f in $(grep -oP 'href="css/\K[^"]+' share/app.html); do
            [ -f "share/css/$f" ] || { echo "  missing stylesheet: $f"; fail=1; }
          done
          for m in $(grep -ohP 'from "\./\K[^"]+' share/js/*.js share/js/views/*.js); do
            [ -f "share/js/$m" ] || [ -f "share/js/views/$m" ] || true
          done
          for m in $(grep -oP 'from "\./\K[^"]+' share/js/main.js); do
            [ -f "share/js/$m" ] || { echo "  main.js imports a missing module: $m"; fail=1; }
          done
          exit $fail

  roadmap:
    name: Roadmap drift (reports, does not block)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Every commit moves a line count, so the generated half of the roadmap is
    # stale the moment anything lands. Gating a merge on that would mean every
    # change carried a roadmap regeneration, which is friction for no safety.
    # Reporting it is the useful half: the numbers are visible and nobody has to
    # remember to look.
    continue-on-error: true
    steps:
      - name: A HOME of this job's own
        run: |
          mkdir -p "$RUNNER_TEMP/home"
          echo "HOME=$RUNNER_TEMP/home" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
      # REPORTS, AND SAYS SO IN ITS EXIT CODE TOO. `roadmap --check` compares
      # generated counts against the file, and some of those counts are the
      # size of the test suite -- which is legitimately smaller here than on a
      # developer's machine, because suites needing optional tools skip. So it
      # can never agree on a runner, and a job named "does not block" that goes
      # red on every single run is a red light nobody reads. It prints the
      # drift and succeeds.
      - name: omacar roadmap --check
        run: ./bin/omacar roadmap --check || echo "::notice::roadmap drift above — run \`omacar roadmap\` when convenient"
